  env: Development
  host: http://localhost:4001
  openApiConf:
    filePath: openapi-auth.yaml
  authentication:
    usernamePassword:
      type: JSON
      loginPath: /auth/login
      usernameField: email
      passwordField: password
      scanUsername: hawkscan@pulse.local
      scanPassword: JIfBbQShqOcpkciFRPcD-w04
    tokenExtraction:
      type: TOKEN_PATH
